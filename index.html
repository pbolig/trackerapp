<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrackerApp Premium</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0e14;
  --panel: #14181f;
  --surface: #1e242e;
  --accent: #3b82f6;
  --accent-glow: rgba(59,130,246,0.3);
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --txt: #f8fafc;
  --txt-dim: #94a3b8;
  --border: rgba(255, 255, 255, 0.08);
  --radius: 12px;
  --font-sans: 'Plus Jakarta Sans', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --sidebar-w: 280px;
  --sidebar-w-collapsed: 64px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--txt);
  font-family: var(--font-sans);
  height: 100vh;
  display: flex;
  overflow: hidden;
}

/* --- Sidebar --- */
.sidebar {
  width: var(--sidebar-w);
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  z-index: 100;
}
.sidebar.collapsed { width: var(--sidebar-w-collapsed); }

.sidebar-header {
  height: 72px;
  padding: 0 24px;
  font-weight: 700;
  font-size: 1.1rem;
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.sidebar.collapsed .sidebar-header span:not(.logo-symbol) { display: none; }
.logo-symbol { color: var(--accent); }

.project-list {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  overflow-x: hidden;
}
.project-item {
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 4px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid transparent;
  white-space: nowrap;
}
.sidebar.collapsed .project-item { padding: 12px; justify-content: center; }
.sidebar.collapsed .project-item span:not(.icon-only) { display: none; }
.sidebar.collapsed .project-item .icon-only { display: block !important; }

.project-item:hover { background: rgba(255,255,255,0.03); }
.project-item.active {
  background: var(--surface);
  border-color: var(--accent);
  color: var(--accent);
}
.project-item .actions { opacity: 0; transition: opacity 0.2s; }
.project-item:not(.collapsed-item):hover .actions { opacity: 1; }

.add-project-btn {
  margin: 12px;
  padding: 12px;
  background: var(--surface);
  border: 1px dashed var(--border);
  border-radius: 8px;
  color: var(--txt-dim);
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  overflow: hidden;
  white-space: nowrap;
}
.sidebar.collapsed .add-project-btn { font-size: 1.5rem; padding: 8px; }
.sidebar.collapsed .add-project-btn span { display: none; }

.sidebar-toggle {
  background: transparent;
  border: none;
  color: var(--txt-dim);
  cursor: pointer;
  padding: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
}
.sidebar-toggle:hover { color: var(--txt); background: rgba(255,255,255,0.05); }

/* --- Main Content --- */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
.header {
  height: 72px;
  padding: 0 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--panel);
  flex-shrink: 0;
}
.header-left { display: flex; align-items: center; gap: 16px; }

.version-summary {
  background: rgba(59, 130, 246, 0.08);
  border: 1px solid rgba(59, 130, 246, 0.15);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.8rem;
  color: var(--txt-dim);
  display: flex;
  gap: 12px;
}
.v-label { color: var(--accent); font-weight: 700; text-transform: uppercase; font-size: 0.7rem; margin-right: 4px; }
.v-val { color: var(--txt); font-weight: 500; }

.bu-tabs {
  display: flex;
  gap: 4px;
  background: var(--bg);
  padding: 4px;
  border-radius: 12px;
}
.tab {
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.8rem;
  font-weight: 700;
  transition: all 0.2s;
  color: var(--txt-dim);
}
.tab:hover { color: var(--txt); }
.tab.active {
  background: var(--accent);
  color: white;
}

.content {
  flex: 1;
  padding: 24px;
  overflow-y: auto;
  scroll-behavior: smooth;
  height: calc(100vh - 72px);
}

/* --- Environment Cards --- */
.env-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
  gap: 24px;
  padding-bottom: 120px; /* Extra space to avoid cropping */
}
.card {
  background: var(--panel);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  display: flex; flex-direction: column;
}
.card-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.card-header h3 { font-size: 0.95rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

.card-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }

.version-group {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
  background: rgba(255,255,255,0.02); padding: 12px; border-radius: 8px; border: 1px solid var(--border);
}

.field { display: flex; flex-direction: column; gap: 4px; }
.label { font-size: 0.65rem; color: var(--txt-dim); text-transform: uppercase; font-weight: 800; letter-spacing: 0.8px; }
.input {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 10px 12px;
  border-radius: 8px;
  color: var(--txt);
  font-family: var(--font-mono);
  font-size: 0.8rem;
  transition: all 0.2s;
  width: 100%;
}
.input:focus { outline: none; border-color: var(--accent); background: rgba(59, 130, 246, 0.05); }
.textarea {
  min-height: 100px;
  resize: vertical;
  line-height: 1.5;
}

/* --- Modal --- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center; z-index: 1000;
}
.modal {
  background: var(--panel); width: 450px; border-radius: 16px; border: 1px solid var(--border);
  padding: 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}
.modal-header { margin-bottom: 24px; }
.modal-title { font-size: 1.5rem; font-weight: 800; }
.modal-footer { margin-top: 32px; display: flex; gap: 12px; justify-content: flex-end; }
.btn {
  padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: all 0.2s; border: 1px solid transparent;
}
.btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
.btn-secondary { background: var(--surface); color: var(--txt-dim); border-color: var(--border); }

/* --- Toast --- */
.toast {
  position: fixed; bottom: 32px; right: 32px; background: var(--surface); border: 1px solid var(--border);
  padding: 14px 24px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  transform: translateY(120px); opacity: 0; transition: all 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
  z-index: 3000; border-left: 4px solid var(--accent); font-weight: 600; font-size: 0.9rem;
}
.toast.show { transform: translateY(0); opacity: 1; }

.icon-only { display: none; font-weight: 800; }
</style>
</head>
<body>

<div id="loading" style="background: var(--bg); position: fixed; inset: 0; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center;">
  <div class="spinner" style="width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite;"></div>
  <p style="color: var(--txt-dim); font-size: 0.9rem; margin-top: 20px">Iniciando TrackerApp...</p>
</div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span>TRACKER<span class="logo-symbol">APP</span></span>
    <span class="logo-symbol icon-only" style="font-size: 1.5rem">T</span>
    <button class="sidebar-toggle" onclick="toggleSidebar()">
      <svg id="toggleIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
  </div>
  <div class="project-list" id="projectList"></div>
  <div class="add-project-btn" onclick="openProjectModal()">
    <span>+ Nuevo Proyecto</span>
    <span class="icon-only">+</span>
  </div>
</aside>

<main class="main">
  <header class="header">
    <div class="header-left">
      <div id="currentProjectTitle" style="font-weight: 800; font-size: 1.25rem;">Selecciona un proyecto</div>
      <div class="version-summary" id="vSummary" style="display: none;">
        <span><span class="v-label">DEV:</span> <span class="v-val" id="sumOfi">-</span> | <span class="v-val" id="sumApi">-</span> | <span class="v-val" id="sumWeb">-</span></span>
      </div>
    </div>
    <div class="bu-tabs" id="buTabs">
      <div class="tab" onclick="switchBU('BSF')">BSF</div>
      <div class="tab" onclick="switchBU('BSC')">BSC</div>
      <div class="tab" onclick="switchBU('BERSA')">BERSA</div>
      <div class="tab" onclick="switchBU('BSJ')">BSJ</div>
    </div>
  </header>

  <div class="content" id="mainContent">
    <div class="env-grid" id="envGrid"></div>
  </div>
</main>

<div class="modal-overlay" id="projectModalOverlay">
  <div class="modal">
    <div class="modal-header"><h2 class="modal-title" id="modalTitle">Nuevo Proyecto</h2></div>
    <div class="modal-body">
      <div class="field">
        <label class="label">Nombre del Sistema</label>
        <input type="text" id="projName" class="input" placeholder="Ej: TESIN, SIGEF...">
      </div>
      <div style="margin-top: 24px">
        <label class="label">U. de Negocio Activadas</label>
        <div style="display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;">
          <label style="cursor: pointer; background: var(--surface); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); font-size: 0.8rem;"><input type="checkbox" value="BSF" checked> BSF</label>
          <label style="cursor: pointer; background: var(--surface); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); font-size: 0.8rem;"><input type="checkbox" value="BSC" checked> BSC</label>
          <label style="cursor: pointer; background: var(--surface); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); font-size: 0.8rem;"><input type="checkbox" value="BERSA" checked> BERSA</label>
          <label style="cursor: pointer; background: var(--surface); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); font-size: 0.8rem;"><input type="checkbox" value="BSJ" checked> BSJ</label>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeProjectModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveProject()">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, set, get, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const FIREBASE_CFG = {
    apiKey: "AIzaSyD_cPC7-GK_CjRkGcCKyv6ozk89Yx0VPjw",
    authDomain: "trackerapp-7331d.firebaseapp.com",
    databaseURL: "https://trackerapp-7331d-default-rtdb.firebaseio.com",
    projectId: "trackerapp-7331d",
    appId: "1:19428285620:web:dd0c7b093ccd6a007bcbe1"
  };

  const app = initializeApp(FIREBASE_CFG);
  const db = getDatabase(app);

  let projects = [];
  let currentProject = null;
  let currentBU = localStorage.getItem('last_bu') || 'BSF';
  let envData = {};

  const projectListEl = document.getElementById('projectList');
  const envGridEl = document.getElementById('envGrid');
  const projectModalOverlay = document.getElementById('projectModalOverlay');
  const toastEl = document.getElementById('toast');
  const currentProjectTitle = document.getElementById('currentProjectTitle');
  const sidebar = document.getElementById('sidebar');
  const vSummary = document.getElementById('vSummary');

  onValue(ref(db, 'projects_v2'), (snapshot) => {
    const data = snapshot.val();
    projects = data ? Object.values(data) : [];
    renderProjects();
    const lastId = localStorage.getItem('last_proj_id');
    if (lastId && projects.find(p => p.id === lastId)) selectProject(lastId);
    else if (!currentProject && projects.length > 0) selectProject(projects[0].id);
    document.getElementById('loading').style.opacity = '0';
    setTimeout(() => document.getElementById('loading').style.display = 'none', 300);
  });

  if (localStorage.getItem('sidebar_collapsed') === 'true') {
    sidebar.classList.add('collapsed');
    document.getElementById('toggleIcon').innerHTML = '<polyline points="9 18 15 12 9 6"></polyline>';
  }

  window.toggleSidebar = () => {
    const isCollapsed = sidebar.classList.toggle('collapsed');
    localStorage.setItem('sidebar_collapsed', isCollapsed);
    document.getElementById('toggleIcon').innerHTML = isCollapsed 
      ? '<polyline points="9 18 15 12 9 6"></polyline>' : '<polyline points="15 18 9 12 15 6"></polyline>';
  };

  window.renderProjects = () => {
    projectListEl.innerHTML = projects.map(p => `
      <div class="project-item ${currentProject?.id === p.id ? 'active' : ''}" onclick="selectProject('${p.id}')">
        <span class="icon-only">${p.name.charAt(0)}</span>
        <span>${p.name}</span>
        <div class="actions">
          <span onclick="event.stopPropagation(); editProject('${p.id}')" style="cursor: pointer; padding: 4px;">✎</span>
          <span onclick="event.stopPropagation(); deleteProject('${p.id}')" style="cursor: pointer; padding: 4px; color: var(--danger)">✕</span>
        </div>
      </div>
    `).join('');
  };

  window.selectProject = (id) => {
    currentProject = projects.find(p => p.id === id);
    if (!currentProject) return;
    localStorage.setItem('last_proj_id', id);
    currentProjectTitle.textContent = currentProject.name;
    renderProjects();
    updateBUTabs();
    syncEnvironments();
  };

  window.updateBUTabs = () => {
    document.querySelectorAll('.tab').forEach(t => {
      const isAvailable = currentProject.bus.includes(t.textContent);
      t.style.display = isAvailable ? 'block' : 'none';
      if (t.textContent === currentBU) t.classList.add('active');
      else t.classList.remove('active');
    });
    if (!currentProject.bus.includes(currentBU)) switchBU(currentProject.bus[0]);
  };

  window.switchBU = (bu) => {
    currentBU = bu;
    localStorage.setItem('last_bu', bu);
    document.querySelectorAll('.tab').forEach(t => {
      if (t.textContent === bu) t.classList.add('active'); else t.classList.remove('active');
    });
    syncEnvironments();
  };

  window.syncEnvironments = () => {
    if (!currentProject) return;
    onValue(ref(db, `envs_v2/${currentProject.id}/${currentBU}`), (snapshot) => {
      const data = snapshot.val() || {};
      envData = {
        dev:  { v_office: '', v_api: '', v_web: '', deploy: '', logs: '', server: '', script: '', notes: '', ...data.dev },
        test: { v_office: '', v_api: '', v_web: '', deploy: '', logs: '', server: '', script: '', notes: '', ...data.test },
        prod: { v_office: '', v_api: '', v_web: '', deploy: '', logs: '', server: '', script: '', notes: '', ...data.prod }
      };
      renderEnvironments();
      updateHeaderSummary();
    });
  };

  window.updateHeaderSummary = () => {
    const dev = envData.dev || {};
    document.getElementById('sumOfi').textContent = dev.v_office || '-';
    document.getElementById('sumApi').textContent = dev.v_api || '-';
    document.getElementById('sumWeb').textContent = dev.v_web || '-';
    vSummary.style.display = 'block';
  };

  window.renderEnvironments = () => {
    const envs = ['dev', 'test', 'prod'];
    envGridEl.innerHTML = envs.map(env => {
      const d = envData[env] || {};
      const t = env === 'dev' ? 'Desarrollo' : env === 'test' ? 'Testeo' : 'Producción';
      return `
        <div class="card">
          <div class="card-header"><h3>${t}</h3><span class="badge badge-${env}" style="padding: 4px 10px; border-radius: 6px; font-size: 0.65rem; font-weight: 800; background: rgba(0,0,0,0.2); border: 1px solid var(--border);">${env.toUpperCase()}</span></div>
          <div class="card-body">
            <div class="field"><label class="label">Sub-Versiones (Oficina | API | Web)</label>
              <div class="version-group">
                <input type="text" class="input" value="${d.v_office || ''}" placeholder="Oficina" onchange="updateEnvField('${env}', 'v_office', this.value)">
                <input type="text" class="input" value="${d.v_api || ''}" placeholder="API" onchange="updateEnvField('${env}', 'v_api', this.value)">
                <input type="text" class="input" value="${d.v_web || ''}" placeholder="Web" onchange="updateEnvField('${env}', 'v_web', this.value)">
              </div>
            </div>
            <div class="field"><label class="label">Servidor / Servicios</label><input type="text" class="input" value="${d.server || ''}" placeholder="AppSrv-01, Redis..." onchange="updateEnvField('${env}', 'server', this.value)"></div>
            <div class="field"><label class="label">Ruta de Paquete (Deploy)</label><input type="text" class="input" value="${d.deploy || ''}" placeholder="/apps/deploy/..." onchange="updateEnvField('${env}', 'deploy', this.value)"></div>
            <div class="field"><label class="label">Ruta de Logs</label><input type="text" class="input" value="${d.logs || ''}" placeholder="/var/logs/..." onchange="updateEnvField('${env}', 'logs', this.value)"></div>
            <div class="field"><label class="label">Maquetación / Scripts</label><textarea class="input textarea" onchange="updateEnvField('${env}', 'script', this.value)">${d.script || ''}</textarea></div>
            <div class="field"><label class="label">Notas Extra</label><textarea class="input textarea" onchange="updateEnvField('${env}', 'notes', this.value)">${d.notes || ''}</textarea></div>
          </div>
        </div>
      `;
    }).join('');
  };

  window.updateEnvField = (env, f, v) => {
    set(ref(db, `envs_v2/${currentProject.id}/${currentBU}/${env}/${f}`), v).then(() => {
      showToast('Guardado');
      updateHeaderSummary();
    });
  };

  window.openProjectModal = (id = null) => {
    editingProjectId = id;
    const nameInput = document.getElementById('projName');
    const checkBoxes = document.querySelectorAll('#projectModalOverlay input[type="checkbox"]');
    if (id) {
      document.getElementById('modalTitle').textContent = "Editar Proyecto";
      const p = projects.find(x => x.id === id);
      nameInput.value = p.name;
      checkBoxes.forEach(cb => cb.checked = p.bus.includes(cb.value));
    } else {
      document.getElementById('modalTitle').textContent = "Nuevo Proyecto";
      nameInput.value = "";
      checkBoxes.forEach(cb => cb.checked = true);
    }
    projectModalOverlay.style.display = 'flex';
    nameInput.focus();
  };

  window.closeProjectModal = () => projectModalOverlay.style.display = 'none';
  window.editProject = (id) => openProjectModal(id);
  window.saveProject = () => {
    const name = document.getElementById('projName').value.trim();
    if (!name) return;
    const bus = Array.from(document.querySelectorAll('#projectModalOverlay input:checked')).map(cb => cb.value);
    const id = editingProjectId || 'proj_' + Date.now();
    set(ref(db, 'projects_v2/' + id), { id, name, bus }).then(() => {
      showToast('Proyecto guardado'); closeProjectModal(); if (!editingProjectId) selectProject(id);
    });
  };

  window.deleteProject = (id) => {
    if (confirm("¿Eliminar proyecto?")) {
      remove(ref(db, 'projects_v2/' + id)).then(() => {
        remove(ref(db, 'envs_v2/' + id));
        showToast('Eliminado', 'danger');
        if (currentProject?.id === id) {
          currentProject = null; envGridEl.innerHTML = ''; currentProjectTitle.textContent = 'Selecciona'; vSummary.style.display = 'none';
        }
      });
    }
  };

  window.showToast = (msg, type = 'accent') => {
    toastEl.textContent = msg; toastEl.style.borderLeftColor = `var(--${type})`; toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 2000);
  };
</script>
<style>@keyframes spin { to { transform: rotate(360deg); } }</style>
</body>
</html>
