<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrackerApp Ultimate</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #06080a;
  --panel: #0f1217;
  --surface: #171c24;
  --accent: #3b82f6;
  --accent-glow: rgba(59,130,246,0.3);
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --txt: #f1f5f9;
  --txt-dim: #94a3b8;
  --border: rgba(255, 255, 255, 0.06);
  --radius: 14px;
  --font-sans: 'Plus Jakarta Sans', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --sidebar-w: 260px;
  --sidebar-w-collapsed: 68px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--txt); font-family: var(--font-sans);
  height: 100vh; display: flex; overflow: hidden;
}

/* --- Sidebar --- */
.sidebar {
  width: var(--sidebar-w); background: var(--panel); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0; transition: width 0.3s ease;
}
.sidebar.collapsed { width: var(--sidebar-w-collapsed); }
.sidebar-header {
  height: 72px; padding: 0 24px; font-weight: 800; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.sidebar.collapsed .sidebar-header span:not(.logo-symbol) { display: none; }
.logo-symbol { color: var(--accent); }

.project-list { flex: 1; overflow-y: auto; padding: 12px; }
.project-item {
  padding: 12px 16px; border-radius: 10px; margin-bottom: 6px; cursor: pointer;
  transition: all 0.2s; display: flex; justify-content: space-between; align-items: center;
  border: 1px solid transparent; white-space: nowrap;
}
.sidebar.collapsed .project-item { padding: 12px; justify-content: center; }
.sidebar.collapsed .project-item span:not(.icon-only) { display: none; }
.project-item:hover { background: rgba(59, 130, 246, 0.05); }
.project-item.active { background: var(--surface); border-color: var(--accent); color: var(--accent); }
.project-item .actions { opacity: 0; display: flex; gap: 8px; }
.project-item:hover .actions { opacity: 1; }

.add-btn {
  margin: 12px; padding: 12px; border-radius: 10px; text-align: center; cursor: pointer;
  border: 1px dashed var(--border); color: var(--txt-dim); font-weight: 600;
  transition: all 0.2s; white-space: nowrap; overflow: hidden;
}
.add-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(59, 130, 246, 0.05); }

/* --- Main Content --- */
.main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.header {
  height: 72px; padding: 0 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; background: var(--panel);
}
.bu-tabs { display: flex; gap: 6px; background: var(--bg); padding: 5px; border-radius: 12px; }
.tab {
  padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85rem;
  font-weight: 700; transition: all 0.2s; color: var(--txt-dim);
}
.tab.active { background: var(--accent); color: white; }
.tab-add { color: var(--accent); background: rgba(59, 130, 246, 0.1); }

.content { flex: 1; padding: 24px; overflow-y: auto; background: var(--bg); }

/* --- Layout Hierarchical --- */
.env-row { display: flex; gap: 24px; padding-bottom: 100px; min-width: max-content; }
.env-col { width: 400px; display: flex; flex-direction: column; gap: 20px; }
.env-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 8px; border-left: 3px solid var(--accent);
}
.env-header h3 { font-size: 1.1rem; font-weight: 800; text-transform: uppercase; color: var(--txt-dim); }

/* Subversion Card */
.sv-card {
  background: var(--panel); border-radius: var(--radius); border: 1px solid var(--border);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3); overflow: hidden;
}
.sv-header {
  padding: 16px 20px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.02);
  display: flex; justify-content: space-between; align-items: center;
}
.sv-header h4 { font-size: 0.9rem; font-weight: 800; color: var(--accent); }
.sv-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }

/* Dynamic Field */
.field { display: flex; flex-direction: column; gap: 6px; position: relative; }
.field:hover .field-actions { opacity: 1; }
.field-actions {
  position: absolute; top: 0; right: 0; opacity: 0; display: flex; gap: 8px; transition: opacity 0.2s;
}
.label { font-size: 0.65rem; color: var(--txt-dim); text-transform: uppercase; font-weight: 800; letter-spacing: 0.5px; }
.input {
  background: var(--bg); border: 1px solid var(--border); padding: 12px 14px;
  border-radius: 10px; color: var(--txt); font-family: var(--font-sans); font-size: 0.85rem;
  width: 100%; transition: all 0.2s;
}
.input:focus { outline: none; border-color: var(--accent); background: rgba(59, 130, 246, 0.05); }
.textarea { min-height: 80px; resize: vertical; line-height: 1.5; font-family: inherit; }

/* --- Actions --- */
.btn-sm { padding: 4px 8px; font-size: 0.7rem; border-radius: 4px; font-weight: 700; cursor: pointer; border: none; }
.btn-accent { background: var(--accent); color: white; }
.btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
.btn-ghost { background: transparent; color: var(--txt-dim); border: 1px solid var(--border); }
.btn-ghost:hover { border-color: var(--txt-dim); color: var(--txt); }

/* --- Modals --- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center; z-index: 1000;
}
.modal {
  background: var(--surface); width: 440px; border-radius: 20px; border: 1px solid var(--border);
  padding: 32px; box-shadow: 0 30px 80px rgba(0,0,0,0.7);
}
.modal-footer { margin-top: 28px; display: flex; gap: 12px; justify-content: flex-end; }
.modal-body { display: flex; flex-direction: column; gap: 16px; }

/* Transfers & Email */
#emailPreview {
  background: #111; padding: 20px; border-radius: 10px; font-family: var(--font-mono);
  font-size: 0.8rem; overflow-y: auto; max-height: 300px; border: 1px solid var(--border);
  line-height: 1.6; color: #aaa;
}

/* Utils */
.flex-center { display: flex; align-items: center; justify-content: center; }
.icon-only { font-weight: 900; }
.spinner {
  width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loading" class="flex-center" style="position: fixed; inset: 0; background: var(--bg); z-index: 2000;">
  <div><div class="spinner"></div><p style="margin-top: 20px; color: var(--txt-dim); font-weight: 600;">Sincronizando Ultimate Core...</p></div>
</div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span>TRACKER<span class="logo-symbol">APP</span></span>
    <button class="btn-ghost btn-sm" onclick="toggleSidebar()">☰</button>
  </div>
  <div class="project-list" id="projectList"></div>
  <div class="add-btn" onclick="openProjModal()">+ Nuevo Proyecto</div>
</aside>

<main class="main">
  <header class="header">
    <div id="pathSummary" style="font-weight: 800; font-size: 1.1rem; color: var(--txt-dim)">Selecciona un proyecto</div>
    <div class="bu-tabs" id="buTabs"></div>
  </header>
  <div class="content">
    <div class="env-row" id="envGrid"></div>
  </div>
</main>

<!-- Generic Entity Modal -->
<div class="modal-overlay" id="entityModal">
  <div class="modal">
    <h2 id="modalTitle" style="margin-bottom: 24px; font-weight: 800;">Añadir Objeto</h2>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn-ghost" style="padding: 10px 20px; border-radius: 8px;" onclick="closeModal()">Cerrar</button>
      <button class="btn-accent" style="padding: 10px 20px; border-radius: 8px;" id="modalSave">Guardar</button>
    </div>
  </div>
</div>

<!-- Email Preview Modal -->
<div class="modal-overlay" id="transferModal">
  <div class="modal" style="width: 600px;">
    <h2 style="margin-bottom: 20px; font-weight: 800;">Solicitud de Pase de Versión</h2>
    <div id="emailPreview"></div>
    <div class="modal-footer">
      <button class="btn-ghost" style="padding: 10px 20px; border-radius: 8px;" onclick="closeTransferModal()">Cerrar</button>
      <button class="btn-accent" style="padding: 10px 20px; border-radius: 8px;" onclick="copyEmail()">Copiar Texto</button>
    </div>
  </div>
</div>

<div id="toast" style="position: fixed; bottom: 30px; right: 30px; background: var(--surface); padding: 16px 24px; border-radius: 12px; transform: translateY(100px); opacity: 0; transition: all 0.3s; z-index: 3000;"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const CFG = {
  apiKey:"AIzaSyD_cPC7-GK_CjRkGcCKyv6ozk89Yx0VPjw",
  authDomain:"trackerapp-7331d.firebaseapp.com",
  databaseURL:"https://trackerapp-7331d-default-rtdb.firebaseio.com",
  projectId:"trackerapp-7331d",
  appId:"1:19428285620:web:dd0c7b093ccd6a007bcbe1"
};

const app = initializeApp(CFG);
const db = getDatabase(app);

// State
let projects = {};
let curProjId = null;
let curBuId = null;

// DOM
const listEl = document.getElementById('projectList');
const buTabsEl = document.getElementById('buTabs');
const envGridEl = document.getElementById('envGrid');
const pathEl = document.getElementById('pathSummary');
const toastEl = document.getElementById('toast');

// --- Sync ---
onValue(ref(db, 'projects_v3'), (snap) => {
  projects = snap.val() || {};
  renderSidebar();
  if (curProjId) refreshUI();
  document.getElementById('loading').style.display = 'none';
});

function renderSidebar() {
  listEl.innerHTML = Object.entries(projects).map(([id, p]) => `
    <div class="project-item ${curProjId === id ? 'active' : ''}" onclick="selectProj('${id}')">
      <span class="icon-only">${p.name.charAt(0)}</span>
      <span>${p.name}</span>
      <div class="actions">
        <span onclick="event.stopPropagation(); deleteProj('${id}')" style="color: var(--danger)">✕</span>
      </div>
    </div>
  `).join('');
}

window.selectProj = (id) => {
  curProjId = id;
  const bus = projects[id].bus || {};
  curBuId = Object.keys(bus)[0] || null;
  refreshUI();
};

function refreshUI() {
  renderSidebar();
  renderTabs();
  renderGrid();
  pathEl.textContent = curProjId ? `${projects[curProjId].name}` : 'Selecciona un proyecto';
}

function renderTabs() {
  if (!curProjId) return buTabsEl.innerHTML = '';
  const bus = projects[curProjId].bus || {};
  buTabsEl.innerHTML = Object.entries(bus).map(([id, bu]) => `
    <div class="tab ${curBuId === id ? 'active' : ''}" onclick="selectBu('${id}')">${bu.name}</div>
  `).join('') + `<div class="tab tab-add" onclick="addBuPrompt()">+ BU</div>`;
}

window.selectBu = (id) => { curBuId = id; renderTabs(); renderGrid(); };

function renderGrid() {
  if (!curProjId || !curBuId) return envGridEl.innerHTML = '';
  const envs = projects[curProjId].bus[curBuId].envs || {};
  
  // Ensure Dev/Test/Prod exist as defaults if empty
  if (Object.keys(envs).length === 0) {
    const defaults = { dev: { name: 'Desarrollo' }, test: { name: 'Testeo' }, prod: { name: 'Producción' } };
    set(ref(db, `projects_v3/${curProjId}/bus/${curBuId}/envs`), defaults);
    return;
  }

  envGridEl.innerHTML = Object.entries(envs).map(([eid, e]) => `
    <div class="env-col">
      <div class="env-header">
        <h3>${e.name}</h3>
        <button class="btn-sm btn-ghost" onclick="addSvPrompt('${eid}')">+ SUBVERSION</button>
      </div>
      <div class="sv-list" style="display: flex; flex-direction: column; gap: 16px;">
        ${Object.entries(e.subversions || {}).map(([sid, s]) => renderSvCard(eid, sid, s)).join('')}
      </div>
    </div>
  `).join('') + `<div class="env-col" style="width: auto;"><button class="add-btn" onclick="addEnvPrompt()">+ Entorno</button></div>`;
}

function renderSvCard(eid, sid, s) {
  return `
    <div class="sv-card">
      <div class="sv-header">
        <h4>${s.name}</h4>
        <div style="display: flex; gap: 8px;">
          <button class="btn-sm btn-ghost" onclick="promotePrompt('${eid}', '${sid}')">PROMOCIONAR</button>
          <button class="btn-sm btn-danger" onclick="deleteSv('${eid}', '${sid}')">✕</button>
        </div>
      </div>
      <div class="sv-body">
        ${Object.entries(s.fields || {}).map(([fid, f]) => renderField(eid, sid, fid, f)).join('')}
        <button class="add-btn" style="margin: 0; padding: 8px;" onclick="addFieldPrompt('${eid}', '${sid}')">+ Campo</button>
      </div>
    </div>
  `;
}

function renderField(eid, sid, fid, f) {
  let control = `<input type="text" class="input" value="${f.val || ''}" onchange="updateF('${eid}','${sid}','${fid}', this.value)">`;
  if (f.type === 'textarea') control = `<textarea class="input textarea" onchange="updateF('${eid}','${sid}','${fid}', this.value)">${f.val || ''}</textarea>`;
  if (f.type === 'date') control = `<input type="date" class="input" value="${f.val || ''}" onchange="updateF('${eid}','${sid}','${fid}', this.value)">`;
  if (f.type === 'link') control = `<div style="display:flex;gap:4px;"><input type="text" class="input" value="${f.val || ''}" onchange="updateF('${eid}','${sid}','${fid}', this.value)"> <a href="${f.val}" target="_blank" class="btn-ghost btn-sm flex-center">↗</a></div>`;

  return `
    <div class="field">
      <span class="label">${f.label}</span>
      <div class="field-actions">
        <span onclick="deleteField('${eid}','${sid}','${fid}')" style="cursor:pointer; color:var(--danger); font-size:0.7rem;">✕</span>
      </div>
      ${control}
    </div>
  `;
}

// --- Logic ---
window.updateF = (eid, sid, fid, val) => {
  set(ref(db, `projects_v3/${curProjId}/bus/${curBuId}/envs/${eid}/subversions/${sid}/fields/${fid}/val`), val);
  showToast("Guardado");
};

// --- Prompts ---
window.openProjModal = () => {
  showModal("Nuevo Proyecto", `<input type="text" id="mInp" class="input" placeholder="Nombre...">`, () => {
    const name = document.getElementById('mInp').value;
    if (!name) return;
    const id = 'p_' + Date.now();
    set(ref(db, `projects_v3/${id}`), { id, name }).then(() => (curProjId = id, closeModal()));
  });
};

window.addBuPrompt = () => {
  showModal("Nueva Unidad de Negocio", `<input type="text" id="mInp" class="input" placeholder="Nombre (BSF, BSC...)">`, () => {
    const name = document.getElementById('mInp').value;
    if (!name) return;
    const id = 'bu_' + Date.now();
    set(ref(db, `projects_v3/${curProjId}/bus/${id}`), { id, name }).then(() => (curBuId = id, closeModal()));
  });
};

window.addEnvPrompt = () => {
  showModal("Nuevo Entorno", `<input type="text" id="mInp" class="input" placeholder="Nombre (Staging, Pre...)">`, () => {
    const name = document.getElementById('mInp').value;
    if (!name) return;
    const id = 'env_' + Date.now();
    set(ref(db, `projects_v3/${curProjId}/bus/${curBuId}/envs/${id}`), { id, name }).then(closeModal);
  });
};

window.addSvPrompt = (eid) => {
  showModal("Nueva Subversion", `<input type="text" id="mInp" class="input" placeholder="Nombre (Office, API, Web, Mobile...)">`, () => {
    const name = document.getElementById('mInp').value;
    if (!name) return;
    const id = 'sv_' + Date.now();
    const defaults = {
      f1: { label: 'Versión', type: 'text', val: '' },
      f2: { label: 'Servidor / Servicios', type: 'text', val: '' },
      f3: { label: 'Ruta de Paquete', type: 'text', val: '' },
      f4: { label: 'Ruta de Logs', type: 'text', val: '' },
      f5: { label: 'Maquetación / Scripts', type: 'textarea', val: '' }
    };
    set(ref(db, `projects_v3/${curProjId}/bus/${curBuId}/envs/${eid}/subversions/${id}`), { id, name, fields: defaults }).then(closeModal);
  });
};

window.addFieldPrompt = (eid, sid) => {
  showModal("Añadir Campo", `
    <input type="text" id="fLabel" class="input" placeholder="Etiqueta (ej: Base de Datos)">
    <select id="fType" class="input" style="margin-top:10px">
      <option value="text">Texto Corto</option>
      <option value="textarea">Área de Texto</option>
      <option value="date">Fecha</option>
      <option value="link">Enlace / URL</option>
    </select>
  `, () => {
    const label = document.getElementById('fLabel').value;
    const type = document.getElementById('fType').value;
    if (!label) return;
    const id = 'f_' + Date.now();
    set(ref(db, `projects_v3/${curProjId}/bus/${curBuId}/envs/${eid}/subversions/${sid}/fields/${id}`), { label, type, val: '' }).then(closeModal);
  });
};

// --- Promotion & Rollback ---
let lastSnapshot = null;
window.promotePrompt = (eid, sid) => {
  const envs = projects[curProjId].bus[curBuId].envs;
  const currentEnv = envs[eid];
  const otherEnvs = Object.entries(envs).filter(([id]) => id !== eid);
  
  if (otherEnvs.length === 0) return alert("No hay otros entornos para promocionar.");

  showModal("Promocionar Versión", `
    <p style="font-size:0.8rem; color:var(--txt-dim); margin-bottom:10px;">Promocionar "${currentEnv.subversions[sid].name}" de ${currentEnv.name} a:</p>
    <select id="targetEnv" class="input">
      ${otherEnvs.map(([id, e]) => `<option value="${id}">${e.name}</option>`).join('')}
    </select>
  `, () => {
    const targetId = document.getElementById('targetEnv').value;
    promoteVersion(eid, sid, targetId);
    closeModal();
  });
};

function promoteVersion(sourceEid, sid, targetEid) {
  const sourceSv = projects[curProjId].bus[curBuId].envs[sourceEid].subversions[sid];
  const targetEnvs = projects[curProjId].bus[curBuId].envs[targetEid];
  
  // Backup for rollback
  lastSnapshot = JSON.parse(JSON.stringify(targetEnvs.subversions || {}));

  // Logic: find or create subversion in target
  let targetSid = Object.keys(targetEnvs.subversions || {}).find(k => targetEnvs.subversions[k].name === sourceSv.name);
  if (!targetSid) targetSid = 'sv_' + Date.now();

  set(ref(db, `projects_v3/${curProjId}/bus/${curBuId}/envs/${targetEid}/subversions/${targetSid}`), sourceSv).then(() => {
    generateEmail(sourceEid, sid, targetEid);
    showToast(`Promocionado a ${targetEnvs.name}`);
  });
}

function generateEmail(sEid, sid, tEid) {
  const p = projects[curProjId];
  const bu = p.bus[curBuId];
  const sEnv = bu.envs[sEid];
  const tEnv = bu.envs[tEid];
  const sv = sEnv.subversions[sid];

  let text = `SOLICITUD DE PASE DE VERSIÓN\n`;
  text += `============================\n\n`;
  text += `Proyecto: ${p.name}\n`;
  text += `Unidad de Negocio: ${bu.name}\n`;
  text += `Sub-sistema: ${sv.name}\n\n`;
  text += `ORIGEN: ${sEnv.name.toUpperCase()}\n`;
  text += `DESTINO: ${tEnv.name.toUpperCase()}\n\n`;
  text += `DETALLES:\n`;
  Object.values(sv.fields).forEach(f => {
    text += `- ${f.label}: ${f.val}\n`;
  });
  text += `\nSolicito aplicar este pase a la brevedad.\nGracias.`;

  document.getElementById('emailPreview').innerText = text;
  document.getElementById('transferModal').style.display = 'flex';
}

window.copyEmail = () => {
  navigator.clipboard.writeText(document.getElementById('emailPreview').innerText);
  showToast("Copiado al portapapeles");
};

window.closeTransferModal = () => document.getElementById('transferModal').style.display = 'none';

// --- Modals Utils ---
function showModal(title, bodyHtml, onSave) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalSave').onclick = onSave;
  document.getElementById('entityModal').style.display = 'flex';
}
window.closeModal = () => document.getElementById('entityModal').style.display = 'none';

window.deleteProj = (id) => { if(confirm("¿Eliminar proyecto?")) remove(ref(db, `projects_v3/${id}`)); };
window.deleteSv = (eid, sid) => { if(confirm("¿Eliminar subversion?")) remove(ref(db, `projects_v3/${curProjId}/bus/${curBuId}/envs/${eid}/subversions/${sid}`)); };
window.deleteField = (eid, sid, fid) => { if(confirm("¿Eliminar campo?")) remove(ref(db, `projects_v3/${curProjId}/bus/${curBuId}/envs/${eid}/subversions/${sid}/fields/${fid}`)); };

window.showToast = (msg, type = 'accent') => {
  toastEl.textContent = msg; toastEl.style.opacity = '1'; toastEl.style.transform = 'translateY(0)';
  setTimeout(() => { toastEl.style.opacity = '0'; toastEl.style.transform = 'translateY(100px)'; }, 2000);
};

window.toggleSidebar = () => {
  sidebar.classList.toggle('collapsed');
  localStorage.setItem('sidebar_collapsed', sidebar.classList.contains('collapsed'));
};
</script>
</body>
</html>
