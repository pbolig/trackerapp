<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrackerApp Premium</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0e14;
  --panel: #14181f;
  --surface: #1e242e;
  --accent: #3b82f6;
  --accent-glow: rgba(59,130,246,0.3);
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --txt: #f8fafc;
  --txt-dim: #94a3b8;
  --border: rgba(255, 255, 255, 0.08);
  --radius: 12px;
  --font-sans: 'Plus Jakarta Sans', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--txt);
  font-family: var(--font-sans);
  min-height: 100vh;
  display: flex;
  overflow: hidden;
}

/* --- Sidebar --- */
.sidebar {
  width: 280px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.sidebar-header {
  padding: 24px;
  font-weight: 700;
  font-size: 1.25rem;
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.sidebar-header span { color: var(--accent); }

.project-list {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}
.project-item {
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 4px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid transparent;
}
.project-item:hover { background: rgba(255,255,255,0.03); }
.project-item.active {
  background: var(--surface);
  border-color: var(--accent);
  color: var(--accent);
}
.project-item .actions { opacity: 0; transition: opacity 0.2s; }
.project-item:hover .actions { opacity: 1; }

.add-project-btn {
  margin: 12px;
  padding: 12px;
  background: var(--surface);
  border: 1px dashed var(--border);
  border-radius: 8px;
  color: var(--txt-dim);
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}
.add-project-btn:hover { border-color: var(--accent); color: var(--accent); }

/* --- Main Content --- */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.header {
  height: 72px;
  padding: 0 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.bu-tabs {
  display: flex;
  gap: 8px;
  background: var(--panel);
  padding: 4px;
  border-radius: 10px;
}
.tab {
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.875rem;
  font-weight: 600;
  transition: all 0.2s;
  color: var(--txt-dim);
}
.tab:hover { color: var(--txt); }
.tab.active {
  background: var(--accent);
  color: white;
}

.content {
  flex: 1;
  padding: 24px;
  overflow-y: auto;
}

/* --- Environment Cards --- */
.env-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 24px;
}
.card {
  background: var(--panel);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  display: flex;
  flex-direction: column;
}
.card-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.card-header h3 {
  font-size: 1rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.badge {
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 0.75rem;
  font-weight: 700;
}
.badge-dev { background: rgba(16, 185, 129, 0.1); color: var(--success); }
.badge-test { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
.badge-prod { background: rgba(239, 68, 68, 0.1); color: var(--danger); }

.card-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.field { display: flex; flex-direction: column; gap: 6px; }
.label { font-size: 0.7rem; color: var(--txt-dim); text-transform: uppercase; font-weight: 700; }
.input {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 10px 12px;
  border-radius: 6px;
  color: var(--txt);
  font-family: var(--font-mono);
  font-size: 0.85rem;
  transition: border-color 0.2s;
  width: 100%;
}
.input:focus { outline: none; border-color: var(--accent); }
.textarea {
  min-height: 100px;
  resize: vertical;
}

/* --- Modal --- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
.modal {
  background: var(--panel);
  width: 450px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 32px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}
.modal-header { margin-bottom: 24px; }
.modal-title { font-size: 1.25rem; font-weight: 700; }
.modal-footer { margin-top: 32px; display: flex; gap: 12px; justify-content: flex-end; }
.btn {
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid transparent;
}
.btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px var(--accent-glow); }
.btn-secondary { background: var(--bg); color: var(--txt-dim); border-color: var(--border); }
.btn-secondary:hover { border-color: var(--txt-dim); color: var(--txt); }

/* --- Loading --- */
#loading {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  transition: opacity 0.3s;
}
.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* --- Toast --- */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 16px 24px;
  border-radius: 8px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  transform: translateY(100px);
  opacity: 0;
  transition: all 0.3s;
  z-index: 3000;
  border-left: 4px solid var(--accent);
}
.toast.show { transform: translateY(0); opacity: 1; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p style="color: var(--txt-dim); font-size: 0.9rem;">Sincronizando con Firebase...</p>
</div>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-header">TRACKER<span>APP</span></div>
  <div class="project-list" id="projectList">
    <!-- Projects will be injected here -->
  </div>
  <div class="add-project-btn" onclick="openProjectModal()">
    + Nuevo Proyecto
  </div>
</aside>

<!-- Main Area -->
<main class="main">
  <header class="header">
    <div id="currentProjectTitle" style="font-weight: 700; font-size: 1.1rem; color: var(--txt-dim)">Selecciona un proyecto</div>
    <div class="bu-tabs" id="buTabs">
      <div class="tab active" onclick="switchBU('BSF')">BSF</div>
      <div class="tab" onclick="switchBU('BSC')">BSC</div>
      <div class="tab" onclick="switchBU('BERSA')">BERSA</div>
      <div class="tab" onclick="switchBU('BSJ')">BSJ</div>
    </div>
  </header>

  <div class="content">
    <div class="env-grid" id="envGrid">
      <!-- Environment cards (Dev, Test, Prod) will be injected here -->
    </div>
  </div>
</main>

<!-- Project Modal -->
<div class="modal-overlay" id="projectModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">Nuevo Proyecto</h2>
    </div>
    <div class="modal-body">
      <div class="field">
        <label class="label">Nombre del Sistema</label>
        <input type="text" id="projName" class="input" placeholder="Ej: TESIN, SIGEF...">
      </div>
      <div style="margin-top: 16px">
        <label class="label">Unidades de Negocio Activadas</label>
        <div style="display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap;">
          <label style="cursor: pointer;"><input type="checkbox" value="BSF" checked> BSF</label>
          <label style="cursor: pointer;"><input type="checkbox" value="BSC" checked> BSC</label>
          <label style="cursor: pointer;"><input type="checkbox" value="BERSA" checked> BERSA</label>
          <label style="cursor: pointer;"><input type="checkbox" value="BSJ" checked> BSJ</label>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeProjectModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveProject()">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">Operación exitosa</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, set, get, onValue, update, remove, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const FIREBASE_CFG = {
    apiKey: "AIzaSyD_cPC7-GK_CjRkGcCKyv6ozk89Yx0VPjw",
    authDomain: "trackerapp-7331d.firebaseapp.com",
    databaseURL: "https://trackerapp-7331d-default-rtdb.firebaseio.com",
    projectId: "trackerapp-7331d",
    appId: "1:19428285620:web:dd0c7b093ccd6a007bcbe1"
  };

  // Initialize Firebase
  const app = initializeApp(FIREBASE_CFG);
  const db = getDatabase(app);

  // App State
  let projects = [];
  let currentProject = null;
  let currentBU = 'BSF';
  let envData = {};

  // DOM Elements
  const projectListEl = document.getElementById('projectList');
  const envGridEl = document.getElementById('envGrid');
  const projectModalOverlay = document.getElementById('projectModalOverlay');
  const toastEl = document.getElementById('toast');
  const currentProjectTitle = document.getElementById('currentProjectTitle');

  // --- Initial Sync ---
  onValue(ref(db, 'projects_v2'), (snapshot) => {
    const data = snapshot.val();
    projects = data ? Object.values(data) : [];
    renderProjects();
    if (!currentProject && projects.length > 0) {
      selectProject(projects[0].id);
    }
    document.getElementById('loading').style.opacity = '0';
    setTimeout(() => document.getElementById('loading').style.display = 'none', 300);
  });

  // --- Functions ---
  window.renderProjects = () => {
    projectListEl.innerHTML = projects.map(p => `
      <div class="project-item ${currentProject?.id === p.id ? 'active' : ''}" onclick="selectProject('${p.id}')">
        <span>${p.name}</span>
        <div class="actions">
          <span onclick="event.stopPropagation(); editProject('${p.id}')" style="cursor: pointer; padding: 4px;">✎</span>
          <span onclick="event.stopPropagation(); deleteProject('${p.id}')" style="cursor: pointer; padding: 4px; color: var(--danger)">✕</span>
        </div>
      </div>
    `).join('');
  };

  window.selectProject = (id) => {
    currentProject = projects.find(p => p.id === id);
    currentProjectTitle.textContent = currentProject.name;
    renderProjects();
    updateBUTabs();
    syncEnvironments();
  };

  window.updateBUTabs = () => {
    const tabs = document.querySelectorAll('.tab');
    tabs.forEach(t => {
      const isAvailable = currentProject.bus.includes(t.textContent);
      t.style.display = isAvailable ? 'block' : 'none';
      if (t.textContent === currentBU) t.classList.add('active');
      else t.classList.remove('active');
    });
    // If current BU not available for this project, switch to first available
    if (!currentProject.bus.includes(currentBU)) {
      switchBU(currentProject.bus[0]);
    }
  };

  window.switchBU = (bu) => {
    currentBU = bu;
    document.querySelectorAll('.tab').forEach(t => {
      if (t.textContent === bu) t.classList.add('active');
      else t.classList.remove('active');
    });
    syncEnvironments();
  };

  window.syncEnvironments = () => {
    if (!currentProject) return;
    const path = `envs_v2/${currentProject.id}/${currentBU}`;
    onValue(ref(db, path), (snapshot) => {
      envData = snapshot.val() || {
        dev: { version: '', deploy: '', logs: '', server: '', script: '', notes: '' },
        test: { version: '', deploy: '', logs: '', server: '', script: '', notes: '' },
        prod: { version: '', deploy: '', logs: '', server: '', script: '', notes: '' }
      };
      renderEnvironments();
    });
  };

  window.renderEnvironments = () => {
    const envs = ['dev', 'test', 'prod'];
    envGridEl.innerHTML = envs.map(env => {
      const d = envData[env] || {};
      return `
        <div class="card">
          <div class="card-header">
            <h3>${env === 'dev' ? 'Desarrollo' : env === 'test' ? 'Testeo' : 'Producción'}</h3>
            <span class="badge badge-${env}">${env.toUpperCase()}</span>
          </div>
          <div class="card-body">
            <div class="field">
              <label class="label">Versión</label>
              <input type="text" class="input" value="${d.version || ''}" placeholder="v1.0.0" onchange="updateEnvField('${env}', 'version', this.value)">
            </div>
            <div class="field">
              <label class="label">Servidor / Servicios</label>
              <input type="text" class="input" value="${d.server || ''}" placeholder="AppServer-01, Redis..." onchange="updateEnvField('${env}', 'server', this.value)">
            </div>
            <div class="field">
              <label class="label">Ruta Deploy</label>
              <input type="text" class="input" value="${d.deploy || ''}" placeholder="/apps/deploy/..." onchange="updateEnvField('${env}', 'deploy', this.value)">
            </div>
            <div class="field">
              <label class="label">Ruta Logs</label>
              <input type="text" class="input" value="${d.logs || ''}" placeholder="/var/logs/..." onchange="updateEnvField('${env}', 'logs', this.value)">
            </div>
            <div class="field">
              <label class="label">Maquetación / Scripts</label>
              <textarea class="input textarea" placeholder="Scripts de despliegue o maquetación..." onchange="updateEnvField('${env}', 'script', this.value)">${d.script || ''}</textarea>
            </div>
            <div class="field">
              <label class="label">Notas</label>
              <textarea class="input textarea" placeholder="Anotaciones extra..." onchange="updateEnvField('${env}', 'notes', this.value)">${d.notes || ''}</textarea>
            </div>
          </div>
        </div>
      `;
    }).join('');
  };

  window.updateEnvField = (env, field, value) => {
    const path = `envs_v2/${currentProject.id}/${currentBU}/${env}/${field}`;
    set(ref(db, path), value).then(() => showToast('Guardado automáticamente'));
  };

  // --- CRUD Project ---
  let editingProjectId = null;
  window.openProjectModal = (id = null) => {
    editingProjectId = id;
    const modalTitle = document.getElementById('modalTitle');
    const nameInput = document.getElementById('projName');
    const checkBoxes = document.querySelectorAll('#projectModalOverlay input[type="checkbox"]');
    
    if (id) {
      modalTitle.textContent = "Editar Proyecto";
      const p = projects.find(x => x.id === id);
      nameInput.value = p.name;
      checkBoxes.forEach(cb => cb.checked = p.bus.includes(cb.value));
    } else {
      modalTitle.textContent = "Nuevo Proyecto";
      nameInput.value = "";
      checkBoxes.forEach(cb => cb.checked = true);
    }
    projectModalOverlay.style.display = 'flex';
  };

  window.closeProjectModal = () => {
    projectModalOverlay.style.display = 'none';
  };

  window.saveProject = () => {
    const name = document.getElementById('projName').value.trim();
    if (!name) return alert("Ingresa un nombre");
    
    const bus = Array.from(document.querySelectorAll('#projectModalOverlay input:checked')).map(cb => cb.value);
    if (bus.length === 0) return alert("Selecciona al menos una Unidad de Negocio");

    const id = editingProjectId || 'proj_' + Date.now();
    const projectObj = { id, name, bus };

    set(ref(db, 'projects_v2/' + id), projectObj).then(() => {
      showToast(editingProjectId ? "Proyecto actualizado" : "Proyecto creado");
      closeProjectModal();
      if (!editingProjectId) selectProject(id);
    });
  };

  window.deleteProject = (id) => {
    if (confirm("¿Seguro que deseas eliminar este proyecto y todos sus entornos?")) {
      remove(ref(db, 'projects_v2/' + id)).then(() => {
        remove(ref(db, 'envs_v2/' + id));
        showToast("Proyecto eliminado", "danger");
        if (currentProject?.id === id) {
          currentProject = null;
          envGridEl.innerHTML = '';
          currentProjectTitle.textContent = 'Selecciona un proyecto';
        }
      });
    }
  };

  // --- UI Helpers ---
  window.showToast = (msg, type = 'accent') => {
    toastEl.textContent = msg;
    toastEl.style.borderLeftColor = `var(--${type})`;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 3000);
  };

</script>
</body>
</html>
